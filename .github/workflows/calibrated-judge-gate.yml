name: Calibrated judge gate

on:
  pull_request_target:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  judge-gate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out trusted base
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.base.sha || github.sha }}
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
      - name: Install Glassbox
        run: python -m pip install .
      - name: Verify operator evidence
        shell: bash
        run: |
          set +e
          python -m glassbox judge verify-report --report .glassbox/ci/judge-report.json --policy .glassbox/ci/judge-gate-policy.toml > judge-gate-result.json
          status=$?
          set -e
          {
            printf '## Calibrated judge gate\n\n```json\n'
            cat judge-gate-result.json
            printf '\n```\n'
            if [ "$status" -eq 2 ]; then
              printf '\nEvidence is missing, invalid, stale, or future-dated. Refresh the operator-generated report on the protected base branch.\n'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"
