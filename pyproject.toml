[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "glassbox"
version = "0.1.0"
description = "Local-first tracing contracts for supply-chain agents."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
dependencies = [
  "pydantic>=2.0",
  "PyYAML>=6.0",
  "jsonschema>=4.0",
  "fastapi>=0.110",
  "uvicorn>=0.27",
  "jinja2>=3.1",
  "python-multipart>=0.0.9",
]

[project.scripts]
glassbox = "glassbox.cli:main"

[project.optional-dependencies]
dev = [
  "httpx>=0.27",
  "import-linter>=2.0",
  "mypy>=1.0",
  "python-dotenv>=1.0",
  "pytest>=8.0",
  "ruff>=0.6",
  "types-jsonschema>=4.0",
  "types-PyYAML>=6.0",
]
judge = ["python-dotenv>=1.0"]
judge-claude = ["python-dotenv>=1.0", "anthropic>=0.45"]
judge-openai = ["python-dotenv>=1.0", "openai>=1.0"]
judge-gemini = ["python-dotenv>=1.0", "google-genai>=1.0"]

[tool.hatch.build.targets.wheel]
packages = ["glassbox"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["glassbox"]

# These are optional extras (judge-claude/judge-openai/judge-gemini in
# [project.optional-dependencies]); their SDKs are not installed by default
# and glassbox/eval/judge_provider.py imports each one lazily inside its own
# factory function, never at module scope.
[[tool.mypy.overrides]]
module = ["anthropic", "openai", "google", "google.genai"]
ignore_missing_imports = true

[tool.importlinter]
root_package = "glassbox"

# NOTE: the array-of-tables key is "contracts" (plural). import-linter's TOML
# reader only recognizes `[[tool.importlinter.contracts]]`; a singular
# "contract" key parses without error but leaves every contract unregistered,
# so `lint-imports` silently checks nothing and always exits 0. See TODO.md
# decision log (2026-08-22).

[[tool.importlinter.contracts]]
name = "events-dependency-neutral"
type = "forbidden"
source_modules = ["glassbox.events"]
forbidden_modules = [
  "glassbox.collector",
  "glassbox.eval",
  "glassbox.explain",
  "glassbox.sdk",
  "glassbox.store",
  "glassbox.web",
]

[[tool.importlinter.contracts]]
name = "store-dependencies"
type = "forbidden"
source_modules = ["glassbox.store"]
forbidden_modules = ["glassbox.eval", "glassbox.explain", "glassbox.web"]

[[tool.importlinter.contracts]]
name = "sdk-dependencies"
type = "forbidden"
source_modules = ["glassbox.sdk"]
forbidden_modules = [
  "glassbox.collector",
  "glassbox.eval",
  "glassbox.explain",
  "glassbox.store",
  "glassbox.web",
]

[[tool.importlinter.contracts]]
name = "eval-dependencies"
type = "forbidden"
source_modules = ["glassbox.eval"]
forbidden_modules = [
  "glassbox.collector",
  "glassbox.sdk",
  "glassbox.explain",
  "glassbox.web",
]

[[tool.importlinter.contracts]]
name = "collector-dependencies"
type = "forbidden"
source_modules = ["glassbox.collector"]
forbidden_modules = [
  "glassbox.eval",
  "glassbox.explain",
  "glassbox.sdk",
  "glassbox.web",
]
[[tool.importlinter.contracts]]
name = "web-dependencies"
type = "forbidden"
source_modules = ["glassbox.web"]
# glassbox.web may legitimately import other glassbox.eval submodules later
# (e.g. shared metrics), so only the judge stack itself is forbidden here --
# not all of glassbox.eval, unlike the broader sdk-dependencies and
# collector-dependencies contracts above. The judge stack is four sibling
# modules, not just glassbox.eval.judge itself: judge_config (loads dotenv),
# judge_provider (the provider-SDK factories), and judge_models (the
# eval-side re-export of the judge value types) all carry the same
# optional-dependency/egress surface and must be listed explicitly --
# import-linter's "forbidden" contract type does not extend a restriction to
# sibling modules on its own.
forbidden_modules = [
  "glassbox.eval.judge",
  "glassbox.eval.judge_config",
  "glassbox.eval.judge_provider",
  "glassbox.eval.judge_models",
  "glassbox.sdk",
]
