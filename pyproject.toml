[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "glassbox"
version = "0.1.0"
description = "Local-first tracing contracts for supply-chain agents."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
dependencies = ["pydantic>=2.0"]

[project.optional-dependencies]
dev = [
  "import-linter>=2.0",
  "mypy>=1.0",
  "pytest>=8.0",
  "ruff>=0.6",
]

[tool.hatch.build.targets.wheel]
packages = ["glassbox"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["glassbox"]

[tool.importlinter]
root_package = "glassbox"

[[tool.importlinter.contract]]
name = "events-dependency-neutral"
type = "forbidden"
source_modules = ["glassbox.events"]
forbidden_modules = [
  "glassbox.collector",
  "glassbox.eval",
  "glassbox.explain",
  "glassbox.sdk",
  "glassbox.store",
  "glassbox.web",
]

[[tool.importlinter.contract]]
name = "sdk-dependencies"
type = "forbidden"
source_modules = ["glassbox.sdk"]
forbidden_modules = [
  "glassbox.collector",
  "glassbox.eval",
  "glassbox.explain",
  "glassbox.store",
  "glassbox.web",
]

[[tool.importlinter.contract]]
name = "collector-dependencies"
type = "forbidden"
source_modules = ["glassbox.collector"]
forbidden_modules = [
  "glassbox.eval",
  "glassbox.explain",
  "glassbox.sdk",
  "glassbox.web",
]

[[tool.importlinter.contract]]
name = "store-dependencies"
type = "forbidden"
source_modules = ["glassbox.store"]
forbidden_modules = ["glassbox.eval", "glassbox.explain", "glassbox.web"]

[[tool.importlinter.contract]]
name = "web-dependencies"
type = "forbidden"
source_modules = ["glassbox.web"]
forbidden_modules = ["glassbox.sdk"]
